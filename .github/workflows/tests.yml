name: Test attendance API
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mongo-contract-tests:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_DB: hrone_candidate_test_isolated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app tests
      - name: Wait for MongoDB readiness
        run: |
          python - <<'PYTEST'
          import time
          from pymongo import MongoClient
          client = MongoClient("mongodb://127.0.0.1:27017", serverSelectionTimeoutMS=1000)
          for attempt in range(25):
              try:
                  client.admin.command("ping")
                  print("MongoDB is ready")
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("MongoDB did not become ready")
          PYTEST
      - run: python -m pytest -q
      - name: Benchmark 100k attendance records and index plans
        env:
          MONGO_DB: hrone_perf_disposable
        run: PYTHONPATH=. python tests/performance_smoke.py
